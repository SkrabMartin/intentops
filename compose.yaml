name: intentops
services:
  api:
    build: .
    image: intentops-api:local
    ports:
      - "127.0.0.1:${INTENTOPS_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "dashboard/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      INTENTOPS_API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:${INTENTOPS_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
