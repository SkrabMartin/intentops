[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "intentops"
version = "0.1.0"
description = "Local-first support intent classification foundations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "IntentOps Contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "streamlit>=1.66.1,<2",
  "httpx>=0.28,<1",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
include = ["app*", "ml*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
